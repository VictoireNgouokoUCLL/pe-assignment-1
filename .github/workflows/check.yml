name: SASM Assignment 1 Check

permissions:
  contents: read

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check submitted files and specification
        run: bash .github/classroom/file-checks.sh

      - name: Note
        if: always()
        run: |
          echo "This workflow is a progress signal for the lecturer."
          echo "It does not grade your work and it does not affect your marks."
